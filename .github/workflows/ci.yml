name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: QuizApp_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d QuizApp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      URL_DATABASE: "postgresql+psycopg://postgres:testpassword@localhost:5432/QuizApp_test"
      URL_DATABASE_TEST: "postgresql+psycopg://postgres:testpassword@localhost:5432/QuizApp_test"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        run: alembic upgrade head

      - name: Run API tests
        run: python -m pytest -q testing/test_main.py

      - name: Build Docker image
        run: docker build -t motorbench:ci .
